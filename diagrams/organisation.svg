<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="780" viewBox="0 0 1360 780">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
  </marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A7F7F"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8892A"/>
  </marker>
  <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
  </filter>
</defs>

<style>
  .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 25px; font-weight: bold; fill: #1F3A5F; }
  .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; fill: #5A6572; }
  .box { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 1.4; }
  .brand { fill: #1F3A5F; stroke: #1F3A5F; }
  .ops { fill: #E9F2F1; stroke: #2A7F7F; }
  .ext { fill: #FCF3E4; stroke: #C8892A; }
  .light { fill: #F4F7FA; stroke: #CBD5E1; }
  .h { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1F3A5F; }
  .hw { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
  .t { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; fill: #333333; }
  .tw { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; fill: #FFFFFF; }
  .s { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; fill: #5A6572; }
  .tag { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #2A7F7F; letter-spacing: 0.6px; }
  .arrow { stroke: #1F3A5F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .conn { stroke: #1F3A5F; stroke-width: 1.6; fill: none; }
  .arrow-teal { stroke: #2A7F7F; stroke-width: 1.6; fill: none; marker-end: url(#arrowTeal); }
  .arrow-amber { stroke: #C8892A; stroke-width: 1.6; fill: none; marker-end: url(#arrowAmber); }
  .dash { stroke-dasharray: 7 5; }
  .dot { stroke-dasharray: 2 4; }
  .lane { fill: #FFFFFF; stroke: #D8E0E8; stroke-width: 1; }
  .lane-alt { fill: #F8FAFC; stroke: #D8E0E8; stroke-width: 1; }
  .cell-blue { fill: #E4EDF7; stroke: #B8CCE2; }
  .cell-teal { fill: #E3F0EE; stroke: #B9D8D4; }
  .cell-amber { fill: #FBEFD8; stroke: #E7CC9B; }
  .cell-grey { fill: #EEF2F6; stroke: #D3DCE5; }
  .note { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 10.5px; fill: #5A6572; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="45" y="48" class="title">Proposed organisation and responsibility structure</text>
<text x="45" y="72" class="subtitle">Lean start: founders hold multiple roles. Ownership, equity and titles are not yet agreed.</text>
<rect x="540" y="100" width="300" height="72" rx="10" class="brand" filter="url(#shadow)"/>
<text x="690.0" y="124" class="hw" text-anchor="middle">FOUNDERS / BOARD</text>
<text x="690.0" y="144" class="tw" text-anchor="middle">Reserved matters: equity, funding, brand deal</text>
<rect x="540" y="225" width="300" height="72" rx="10" class="ops" filter="url(#shadow)"/>
<text x="690.0" y="249" class="h" text-anchor="middle">MANAGING DIRECTOR / CEO</text>
<text x="690.0" y="269" class="t" text-anchor="middle">Strategy, partner relations, funding</text>
<rect x="100" y="370" width="250" height="96" rx="10" class="box" filter="url(#shadow)"/>
<text x="225.0" y="394" class="h" text-anchor="middle">CTO / TECHNOLOGY</text>
<text x="225.0" y="414" class="t" text-anchor="middle">Platform, integrations, security, data</text>
<rect x="400" y="370" width="250" height="96" rx="10" class="box" filter="url(#shadow)"/>
<text x="525.0" y="394" class="h" text-anchor="middle">COO / OPERATIONS</text>
<text x="525.0" y="414" class="t" text-anchor="middle">Suppliers, orders, delivery, support</text>
<rect x="700" y="370" width="250" height="96" rx="10" class="box" filter="url(#shadow)"/>
<text x="825.0" y="394" class="h" text-anchor="middle">FINANCE &amp; COMPLIANCE</text>
<text x="825.0" y="414" class="t" text-anchor="middle">Reconciliation, tax, PDPA, contracts</text>
<rect x="1000" y="370" width="250" height="96" rx="10" class="box" filter="url(#shadow)"/>
<text x="1125.0" y="394" class="h" text-anchor="middle">GROWTH &amp; MARKETING</text>
<text x="1125.0" y="414" class="t" text-anchor="middle">Acquisition, content, partnerships</text>
<rect x="100" y="550" width="250" height="100" rx="10" class="light" filter="url(#shadow)"/>
<text x="225.0" y="574" class="h" text-anchor="middle">ENGINEERING</text>
<text x="225.0" y="594" class="s" text-anchor="middle">MVP, payments,</text>
<text x="225.0" y="609" class="s" text-anchor="middle">carrier adapter</text>
<rect x="400" y="550" width="180" height="100" rx="10" class="light" filter="url(#shadow)"/>
<text x="490.0" y="574" class="h" text-anchor="middle">SUPPLIER SUCCESS</text>
<text x="490.0" y="594" class="s" text-anchor="middle">KYC, onboarding,</text>
<text x="490.0" y="609" class="s" text-anchor="middle">catalogue</text>
<rect x="600" y="550" width="180" height="100" rx="10" class="light" filter="url(#shadow)"/>
<text x="690.0" y="574" class="h" text-anchor="middle">CUSTOMER SUPPORT</text>
<text x="690.0" y="594" class="s" text-anchor="middle">Swahili/English,</text>
<text x="690.0" y="609" class="s" text-anchor="middle">returns, complaints</text>
<rect x="800" y="550" width="180" height="100" rx="10" class="light" filter="url(#shadow)"/>
<text x="890.0" y="574" class="h" text-anchor="middle">LOGISTICS</text>
<text x="890.0" y="594" class="s" text-anchor="middle">Bookings, manifests,</text>
<text x="890.0" y="609" class="s" text-anchor="middle">exceptions</text>
<rect x="1020" y="550" width="270" height="100" rx="10" class="ext" filter="url(#shadow)"/>
<text x="1155.0" y="574" class="h" text-anchor="middle">OUTSOURCED ADVISERS</text>
<text x="1155.0" y="594" class="s" text-anchor="middle">Lawyer · accountant</text>
<text x="1155.0" y="609" class="s" text-anchor="middle">DPO · insurance</text>
<line x1="690" y1="172" x2="690" y2="225" class="arrow"/>
<path d="M 690 297 L 690 330 L 225 330 L 225 370" class="arrow"/>
<path d="M 690 297 L 690 330 L 525 330 L 525 370" class="arrow"/>
<path d="M 690 297 L 690 330 L 825 330 L 825 370" class="arrow"/>
<path d="M 690 297 L 690 330 L 1125 330 L 1125 370" class="arrow"/>
<line x1="225" y1="466" x2="225" y2="550" class="arrow"/>
<line x1="525" y1="466" x2="525" y2="510" class="conn"/>
<line x1="490" y1="510" x2="890" y2="510" class="conn"/>
<line x1="490" y1="510" x2="490" y2="550" class="arrow"/>
<line x1="690" y1="510" x2="690" y2="550" class="arrow"/>
<line x1="890" y1="510" x2="890" y2="550" class="arrow"/>
<path d="M 825 466 L 825 520 L 1155 520 L 1155 550" stroke-dasharray="6 4" stroke="#5A6572" fill="none" marker-end="url(#arrow)"/>
<text x="1000" y="512" class="note">advisory</text>
<text x="45" y="700" class="note">Lean team (pilot): CEO/COO combined, one support agent, part-time developer, outsourced accounting and legal.</text>
<text x="45" y="720" class="note">Moderate team: add an operations lead, second support agent and full-time developer. Ambitious: add finance, marketing and supplier success roles.</text>
<text x="45" y="740" class="note">Segregation of duties: the person who approves supplier payouts should not be the only person who reconciles payments.</text>
</svg>