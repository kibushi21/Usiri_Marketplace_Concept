<text x="40" y="828" class="note">Multi-supplier orders are split into separate parcels and delivery charges. Each parcel carries its own ID and tracking events.</text>
<text x="40" y="846" class="note">Failed delivery: two attempts, then hold at branch for 7 days, then return to supplier. Proof of delivery includes photo and recipient confirmation.</text>
