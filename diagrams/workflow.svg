<rect x="397" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="467.0" y="315" class="t" text-anchor="middle">Checkout,</text>
<text x="467.0" y="330" class="t" text-anchor="middle">payment link</text>
<rect x="546" y="273" width="158" height="100" class="lane-alt"/>
<rect x="555" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="625.0" y="315" class="t" text-anchor="middle">Routes order;</text>
<text x="625.0" y="330" class="t" text-anchor="middle">monitors SLA</text>
<rect x="704" y="273" width="158" height="100" class="lane-alt"/>
<rect x="713" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="783.0" y="315" class="t" text-anchor="middle">Books carrier;</text>
<text x="783.0" y="330" class="t" text-anchor="middle">manifest</text>
<rect x="862" y="273" width="158" height="100" class="lane-alt"/>
<rect x="871" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="941.0" y="315" class="t" text-anchor="middle">Tracking</text>
<text x="941.0" y="330" class="t" text-anchor="middle">updates</text>
<rect x="1020" y="273" width="158" height="100" class="lane-alt"/>
<rect x="1029" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="1099.0" y="315" class="t" text-anchor="middle">Exception</text>
<text x="1099.0" y="330" class="t" text-anchor="middle">handling</text>
<rect x="1178" y="273" width="158" height="100" class="lane-alt"/>
<rect x="1187" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="1257.0" y="315" class="t" text-anchor="middle">Delivery</text>
<text x="1257.0" y="330" class="t" text-anchor="middle">confirmation</text>
<rect x="1336" y="273" width="158" height="100" class="lane-alt"/>
<rect x="1345" y="295" width="140" height="56" rx="7" class="cell-teal"/>
<text x="1415.0" y="315" class="t" text-anchor="middle">Payout, refund,</text>
<text x="1415.0" y="330" class="t" text-anchor="middle">dispute log</text>
<rect x="40" y="373" width="190" height="100" class="lane"/>
<text x="135.0" y="428.0" class="h" text-anchor="middle" font-size="13">SUPPLIER</text>
<rect x="230" y="373" width="158" height="100" class="lane"/>
<rect x="239" y="395" width="140" height="56" rx="7" class="cell-amber"/>
<text x="309.0" y="415" class="t" text-anchor="middle">Onboarded;</text>
<text x="309.0" y="430" class="t" text-anchor="middle">lists stock</text>
<rect x="388" y="373" width="158" height="100" class="lane"/>
<rect x="546" y="373" width="158" height="100" class="lane"/>
<rect x="555" y="395" width="140" height="56" rx="7" class="cell-amber"/>
<text x="625.0" y="415" class="t" text-anchor="middle">Confirms stock;</text>
<text x="625.0" y="430" class="t" text-anchor="middle">packs parcel</text>
<rect x="704" y="373" width="158" height="100" class="lane"/>
<rect x="713" y="395" width="140" height="56" rx="7" class="cell-amber"/>
<text x="783.0" y="415" class="t" text-anchor="middle">Hands parcel</text>
<text x="783.0" y="430" class="t" text-anchor="middle">to carrier</text>
<rect x="862" y="373" width="158" height="100" class="lane"/>
<rect x="1020" y="373" width="158" height="100" class="lane"/>
<rect x="1178" y="373" width="158" height="100" class="lane"/>
<rect x="1336" y="373" width="158" height="100" class="lane"/>
<rect x="1345" y="395" width="140" height="56" rx="7" class="cell-amber"/>
<text x="1415.0" y="415" class="t" text-anchor="middle">Receives payout;</text>
<text x="1415.0" y="430" class="t" text-anchor="middle">handles return</text>
<rect x="40" y="473" width="190" height="100" class="lane-alt"/>
<text x="135.0" y="528.0" class="h" text-anchor="middle" font-size="13">CARRIER</text>
<rect x="230" y="473" width="158" height="100" class="lane-alt"/>
<rect x="388" y="473" width="158" height="100" class="lane-alt"/>
<rect x="546" y="473" width="158" height="100" class="lane-alt"/>
<rect x="704" y="473" width="158" height="100" class="lane-alt"/>
<rect x="713" y="495" width="140" height="56" rx="7" class="cell-grey"/>
<text x="783.0" y="515" class="t" text-anchor="middle">Receives and</text>
<text x="783.0" y="530" class="t" text-anchor="middle">scans parcel</text>
<rect x="862" y="473" width="158" height="100" class="lane-alt"/>
<rect x="871" y="495" width="140" height="56" rx="7" class="cell-grey"/>
<text x="941.0" y="515" class="t" text-anchor="middle">Line-haul;</text>
<text x="941.0" y="530" class="t" text-anchor="middle">status events</text>
<rect x="1020" y="473" width="158" height="100" class="lane-alt"/>
<rect x="1029" y="495" width="140" height="56" rx="7" class="cell-grey"/>
<text x="1099.0" y="515" class="t" text-anchor="middle">Delivers or</text>
<text x="1099.0" y="530" class="t" text-anchor="middle">holds at branch</text>
<rect x="1178" y="473" width="158" height="100" class="lane-alt"/>
<rect x="1187" y="495" width="140" height="56" rx="7" class="cell-grey"/>
<text x="1257.0" y="515" class="t" text-anchor="middle">Returns POD;</text>
<text x="1257.0" y="530" class="t" text-anchor="middle">closes trip</text>
<rect x="1336" y="473" width="158" height="100" class="lane-alt"/>
<rect x="1345" y="495" width="140" height="56" rx="7" class="cell-grey"/>
<text x="1415.0" y="515" class="t" text-anchor="middle">Reverse</text>
<text x="1415.0" y="530" class="t" text-anchor="middle">logistics</text>
<rect x="40" y="573" width="190" height="100" class="lane"/>
<text x="135.0" y="628.0" class="h" text-anchor="middle" font-size="13">PAYMENT PROVIDER</text>
<rect x="230" y="573" width="158" height="100" class="lane"/>
<rect x="388" y="573" width="158" height="100" class="lane"/>
<rect x="397" y="595" width="140" height="56" rx="7" class="cell-grey"/>
