<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="870" viewBox="0 0 1380 870">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
  </marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A7F7F"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8892A"/>
  </marker>
  <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
  </filter>
</defs>

<style>
  .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 25px; font-weight: bold; fill: #1F3A5F; }
  .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; fill: #5A6572; }
  .box { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 1.4; }
  .brand { fill: #1F3A5F; stroke: #1F3A5F; }
  .ops { fill: #E9F2F1; stroke: #2A7F7F; }
  .ext { fill: #FCF3E4; stroke: #C8892A; }
  .light { fill: #F4F7FA; stroke: #CBD5E1; }
  .h { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1F3A5F; }
  .hw { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
  .t { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; fill: #333333; }
  .tw { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; fill: #FFFFFF; }
  .s { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; fill: #5A6572; }
  .tag { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #2A7F7F; letter-spacing: 0.6px; }
  .arrow { stroke: #1F3A5F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .conn { stroke: #1F3A5F; stroke-width: 1.6; fill: none; }
  .arrow-teal { stroke: #2A7F7F; stroke-width: 1.6; fill: none; marker-end: url(#arrowTeal); }
  .arrow-amber { stroke: #C8892A; stroke-width: 1.6; fill: none; marker-end: url(#arrowAmber); }
  .dash { stroke-dasharray: 7 5; }
  .dot { stroke-dasharray: 2 4; }
  .lane { fill: #FFFFFF; stroke: #D8E0E8; stroke-width: 1; }
  .lane-alt { fill: #F8FAFC; stroke: #D8E0E8; stroke-width: 1; }
  .cell-blue { fill: #E4EDF7; stroke: #B8CCE2; }
  .cell-teal { fill: #E3F0EE; stroke: #B9D8D4; }
  .cell-amber { fill: #FBEFD8; stroke: #E7CC9B; }
  .cell-grey { fill: #EEF2F6; stroke: #D3DCE5; }
  .note { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 10.5px; fill: #5A6572; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="45" y="48" class="title">Proposed technology architecture (MVP first)</text>
<text x="45" y="72" class="subtitle">A modular monolith is sufficient for the pilot. Microservices, native apps and AI features are deferred.</text>
<rect x="80" y="110" width="280" height="80" rx="10" class="box" filter="url(#shadow)"/>
<text x="220.0" y="134" class="h" text-anchor="middle">CUSTOMER WEB / PWA</text>
<text x="220.0" y="154" class="t" text-anchor="middle">Mobile-first, low-bandwidth, SEO</text>
<rect x="400" y="110" width="260" height="80" rx="10" class="box" filter="url(#shadow)"/>
<text x="530.0" y="134" class="h" text-anchor="middle">SUPPLIER PORTAL</text>
<text x="530.0" y="154" class="t" text-anchor="middle">Listings, stock, orders, payouts</text>
<rect x="700" y="110" width="260" height="80" rx="10" class="box" filter="url(#shadow)"/>
<text x="830.0" y="134" class="h" text-anchor="middle">ADMIN CONSOLE</text>
<text x="830.0" y="154" class="t" text-anchor="middle">Orders, exceptions, refunds, risk</text>
<rect x="1000" y="110" width="300" height="80" rx="10" class="box" filter="url(#shadow)"/>
<text x="1150.0" y="134" class="h" text-anchor="middle">SUPPORT &amp; NOTIFICATIONS</text>
<text x="1150.0" y="154" class="t" text-anchor="middle">SMS, WhatsApp, email, help desk</text>
<rect x="80" y="240" width="1220" height="60" rx="10" class="light" filter="url(#shadow)"/>
<text x="690.0" y="264" class="h" text-anchor="middle">EDGE: Cloudflare / WAF · TLS · CDN · rate limiting · bot protection</text>
<rect x="80" y="340" width="1220" height="70" rx="10" class="ops" filter="url(#shadow)"/>
<text x="690.0" y="364" class="h" text-anchor="middle">NEXT.JS + TYPESCRIPT APPLICATION (SSR, PWA, accessible, Swahili/English)</text>
<rect x="80" y="440" width="1220" height="70" rx="10" class="ops" filter="url(#shadow)"/>
<text x="690.0" y="464" class="h" text-anchor="middle">FASTAPI BACKEND · REST/JSON · authentication · RBAC · business rules · audit log</text>
<rect x="80" y="550" width="280" height="100" rx="10" class="box" filter="url(#shadow)"/>
<text x="220.0" y="574" class="h" text-anchor="middle">POSTGRESQL</text>
<text x="220.0" y="594" class="t" text-anchor="middle">Orders, catalogue, users, payments, audit</text>
<rect x="390" y="550" width="260" height="100" rx="10" class="box" filter="url(#shadow)"/>
<text x="520.0" y="574" class="h" text-anchor="middle">REDIS (OPTIONAL)</text>
<text x="520.0" y="594" class="t" text-anchor="middle">Sessions, queues, rate limits</text>
<rect x="680" y="550" width="280" height="100" rx="10" class="box" filter="url(#shadow)"/>
<text x="820.0" y="574" class="h" text-anchor="middle">OBJECT STORAGE</text>
<text x="820.0" y="594" class="t" text-anchor="middle">Product images, POD photos, exports</text>
<rect x="990" y="550" width="310" height="100" rx="10" class="box" filter="url(#shadow)"/>
<text x="1145.0" y="574" class="h" text-anchor="middle">ANALYTICS &amp; MONITORING</text>
<text x="1145.0" y="594" class="t" text-anchor="middle">Events, dashboards, alerts, uptime</text>
<rect x="80" y="700" width="270" height="100" rx="10" class="ext" filter="url(#shadow)"/>
<text x="215.0" y="724" class="h" text-anchor="middle">PAYMENT GATEWAY</text>
<text x="215.0" y="744" class="t" text-anchor="middle">Licensed PSP: mobile money, cards</text>
<rect x="380" y="700" width="270" height="100" rx="10" class="ext" filter="url(#shadow)"/>
<text x="515.0" y="724" class="h" text-anchor="middle">CARRIER ADAPTER</text>
<text x="515.0" y="744" class="t" text-anchor="middle">Manual console first; API/CSV later</text>
<rect x="680" y="700" width="270" height="100" rx="10" class="ext" filter="url(#shadow)"/>
<text x="815.0" y="724" class="h" text-anchor="middle">MESSAGING</text>
<text x="815.0" y="744" class="t" text-anchor="middle">SMS aggregator, WhatsApp Business</text>
<rect x="980" y="700" width="320" height="100" rx="10" class="ext" filter="url(#shadow)"/>
<text x="1140.0" y="724" class="h" text-anchor="middle">IDENTITY &amp; RISK</text>
<text x="1140.0" y="744" class="t" text-anchor="middle">Phone OTP, KYC checks, fraud rules</text>
<line x1="220" y1="190" x2="220" y2="240" class="arrow"/>
<line x1="530" y1="190" x2="530" y2="240" class="arrow"/>
<line x1="830" y1="190" x2="830" y2="240" class="arrow"/>
<line x1="1150" y1="190" x2="1150" y2="240" class="arrow"/>
<line x1="690" y1="300" x2="690" y2="340" class="arrow"/>
<line x1="690" y1="410" x2="690" y2="440" class="arrow"/>
<line x1="220" y1="510" x2="220" y2="550" class="arrow"/>
<line x1="520" y1="510" x2="520" y2="550" class="arrow"/>
<line x1="820" y1="510" x2="820" y2="550" class="arrow"/>
<line x1="1145" y1="510" x2="1145" y2="550" class="arrow"/>
<line x1="215" y1="650" x2="215" y2="700" class="arrow"/>
<line x1="515" y1="650" x2="515" y2="700" class="arrow"/>
<line x1="815" y1="650" x2="815" y2="700" class="arrow"/>
<line x1="1140" y1="650" x2="1140" y2="700" class="arrow"/>
<text x="45" y="840" class="note">Deferred: microservices, native iOS/Android apps, automated carrier API, AI recommendations, multi-country, warehouse management, complex escrow.</text>
</svg>