<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
  </marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A7F7F"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8892A"/>
  </marker>
  <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
  </filter>
</defs>

<style>
  .title { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 25px; font-weight: bold; fill: #1F3A5F; }
  .subtitle { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 13px; fill: #5A6572; }
  .box { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 1.4; }
  .brand { fill: #1F3A5F; stroke: #1F3A5F; }
  .ops { fill: #E9F2F1; stroke: #2A7F7F; }
  .ext { fill: #FCF3E4; stroke: #C8892A; }
  .light { fill: #F4F7FA; stroke: #CBD5E1; }
  .h { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1F3A5F; }
  .hw { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; }
  .t { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; fill: #333333; }
  .tw { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 12.5px; fill: #FFFFFF; }
  .s { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; fill: #5A6572; }
  .tag { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #2A7F7F; letter-spacing: 0.6px; }
  .arrow { stroke: #1F3A5F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .conn { stroke: #1F3A5F; stroke-width: 1.6; fill: none; }
  .arrow-teal { stroke: #2A7F7F; stroke-width: 1.6; fill: none; marker-end: url(#arrowTeal); }
  .arrow-amber { stroke: #C8892A; stroke-width: 1.6; fill: none; marker-end: url(#arrowAmber); }
  .dash { stroke-dasharray: 7 5; }
  .dot { stroke-dasharray: 2 4; }
  .lane { fill: #FFFFFF; stroke: #D8E0E8; stroke-width: 1; }
  .lane-alt { fill: #F8FAFC; stroke: #D8E0E8; stroke-width: 1; }
  .cell-blue { fill: #E4EDF7; stroke: #B8CCE2; }
  .cell-teal { fill: #E3F0EE; stroke: #B9D8D4; }
  .cell-amber { fill: #FBEFD8; stroke: #E7CC9B; }
  .cell-grey { fill: #EEF2F6; stroke: #D3DCE5; }
  .note { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 10.5px; fill: #5A6572; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="45" y="48" class="title">Proposed business model: a managed, asset-light marketplace</text>
<text x="45" y="72" class="subtitle">Concept only. No franchise, brand licence, logistics or payment agreement has been concluded.</text>
<rect x="500" y="105" width="400" height="82" rx="10" class="brand" filter="url(#shadow)"/>
<text x="700.0" y="129" class="hw" text-anchor="middle">USIRI GROUP (potential)</text>
<text x="700.0" y="149" class="tw" text-anchor="middle">Brand owner and logistics partner</text>
<rect x="500" y="330" width="400" height="120" rx="10" class="ops" filter="url(#shadow)"/>
<text x="700.0" y="354" class="h" text-anchor="middle">MARKETPLACE OPERATOR</text>
<text x="700.0" y="374" class="t" text-anchor="middle">Founders' Tanzanian company</text>
<text x="700.0" y="389" class="t" text-anchor="middle">Platform · suppliers · orders · support</text>
<rect x="80" y="330" width="290" height="120" rx="10" class="box" filter="url(#shadow)"/>
<text x="225.0" y="354" class="h" text-anchor="middle">VERIFIED SUPPLIERS</text>
<text x="225.0" y="374" class="t" text-anchor="middle">Wholesalers, distributors</text>
<text x="225.0" y="389" class="t" text-anchor="middle">and manufacturers</text>
<rect x="1030" y="330" width="290" height="120" rx="10" class="box" filter="url(#shadow)"/>
<text x="1175.0" y="354" class="h" text-anchor="middle">CUSTOMERS</text>
<text x="1175.0" y="374" class="t" text-anchor="middle">Dar es Salaam first</text>
<text x="1175.0" y="389" class="t" text-anchor="middle">Upcountry collection points</text>
<rect x="550" y="580" width="300" height="90" rx="10" class="ext" filter="url(#shadow)"/>
<text x="700.0" y="604" class="h" text-anchor="middle">CONTRACTED CARRIER(S)</text>
<text x="700.0" y="624" class="t" text-anchor="middle">Usiri or a qualified alternative</text>
<line x1="690" y1="187" x2="690" y2="330" class="arrow-amber dash"/>
<text x="705" y="245" class="s" text-anchor="start">brand licence, standards,</text>
<text x="705" y="261" class="s" text-anchor="start">logistics capacity (proposed)</text>
<line x1="370" y1="375" x2="500" y2="375" class="arrow"/>
<text x="435" y="365" class="s" text-anchor="middle">products, stock</text>
<line x1="500" y1="415" x2="370" y2="415" class="arrow"/>
<text x="435" y="433" class="s" text-anchor="middle">orders, payouts</text>
<line x1="900" y1="375" x2="1030" y2="375" class="arrow"/>
<text x="965" y="365" class="s" text-anchor="middle">catalogue, checkout</text>
<line x1="1030" y1="415" x2="900" y2="415" class="arrow"/>
<text x="965" y="433" class="s" text-anchor="middle">orders, payment</text>
<line x1="680" y1="450" x2="680" y2="580" class="arrow"/>
<text x="695" y="520" class="s" text-anchor="start">bookings, manifest</text>
<line x1="760" y1="580" x2="760" y2="450" class="arrow"/>
<text x="775" y="545" class="s" text-anchor="start">POD, exceptions</text>
<path d="M 850 625 L 1000 625 L 1000 450" class="arrow"/>
<text x="1010" y="612" class="s" text-anchor="start">delivery / collection</text>
<rect x="80" y="700" width="1240" height="48" rx="8" class="light"/>
<text x="100" y="721" class="h" font-size="13">Regulatory perimeter</text>
<text x="100" y="738" class="s">FCC (consumer contracts) · PDPC (personal data) · Bank of Tanzania (payments) · TCRA (courier licensing) · TRA (tax) · BRELA (company and trademarks)</text>
<text x="80" y="790" class="tag">MONEY FLOW (SIMPLIFIED)</text>
<rect x="80" y="802" width="270" height="58" rx="7" class="box"/>
<text x="215" y="823" class="h" font-size="12.5" text-anchor="middle">Customer pays</text>
<text x="215" y="842" class="s" text-anchor="middle">mobile money, card or bank</text>
<line x1="352" y1="831" x2="390" y2="831" class="arrow-teal"/>
<rect x="392" y="802" width="270" height="58" rx="7" class="box"/>
<text x="527" y="823" class="h" font-size="12.5" text-anchor="middle">Licensed PSP collects</text>
<text x="527" y="842" class="s" text-anchor="middle">settlement to operator account</text>
<line x1="664" y1="831" x2="702" y2="831" class="arrow-teal"/>
<rect x="704" y="802" width="270" height="58" rx="7" class="box"/>
<text x="839" y="823" class="h" font-size="12.5" text-anchor="middle">Operator deducts fees</text>
<text x="839" y="842" class="s" text-anchor="middle">commission, coordination fee</text>
<line x1="976" y1="831" x2="1014" y2="831" class="arrow-teal"/>
<rect x="1016" y="802" width="270" height="58" rx="7" class="box"/>
<text x="1151" y="823" class="h" font-size="12.5" text-anchor="middle">Supplier is paid</text>
<text x="1151" y="842" class="s" text-anchor="middle">after delivery confirmation</text>
<text x="45" y="890" class="note">Solid arrows = operational flows. Dashed amber = proposed contractual relationship. Carrier delivery charges are a pass-through, not marketplace revenue.</text>
</svg>